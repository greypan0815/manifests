# kubeflow-notebook-scc.yaml
# how to use:
#   oc apply -f kubeflow-notebook-scc.yaml
#   SA=($oc -n $NS get notebook $NB -o jsonpath='{.spec.template.spec.serviceAccountName}{"\n"}')
#   oc adm policy add-scc-to-user kubeflow-notebook -z $SA -n <your-notebook-namespace>
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: kubeflow-notebook
allowPrivilegeEscalation: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny           # 允許 fsGroup=100
supplementalGroups:
  type: RunAsAny           # 允許任意補充群組
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
readOnlyRootFilesystem: false
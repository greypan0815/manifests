apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    dataStudio: api-server
  name: poddefault-configmap-editor
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "delete", "update", "patch"]
- apiGroups: ["kubeflow.org"]
  resources: ["poddefaults"]
  verbs: ["get", "list", "create", "delete", "update", "patch"]
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - rbac.yaml

namespace: kubeflow

images:
- name: config-synchronizer:v1.0
  newName: 404906229455.dkr.ecr.ap-northeast-1.amazonaws.com/data-studio/beaver-operators-config-synchronizer
  newTag: 1.0.0-ds

patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: beaver-config-synchronizer
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/command
      value: ["kopf", "run", "synchronizer.py"]

- path: patches/delete-clusterrole.yaml
- path: patches/delete-clusterrolebinding.yaml
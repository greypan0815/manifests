---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beaver-config-synchronizer
  namespace: beaver
spec:
  replicas: 1
  selector:
    matchLabels:
      name: synchronizer
  template:
    metadata:
      labels:
        name: synchronizer
    spec:
      serviceAccountName: beaver-synchronizer
      containers:
        - name: synchronizer
          image: config-synchronizer:v1.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi

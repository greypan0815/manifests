---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: beaver-synchronizer
  namespace: beaver
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: beaver-synchronizer-clusterrole
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["*"]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: ["namespaces", "namespaces/status"]
    verbs: ["*"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: beaver-synchronizer-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: beaver-synchronizer
    namespace: beaver
roleRef:
  kind: ClusterRole
  name: beaver-synchronizer-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
